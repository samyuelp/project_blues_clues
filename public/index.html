<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Project Blue's Clues</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <!-- Ambient floating particles behind everything -->
  <canvas id="bg-canvas" class="bg-canvas"></canvas>

  <div id="app">

    <!-- ============ Loading ============ -->
    <section class="screen active" id="screen-loading">
      <div class="loader">
        <div class="loader-ring"></div>
        <div class="loader-ring"></div>
        <div class="loader-ring"></div>
        <div class="loader-core"></div>
      </div>
      <p class="muted">Warming up the vault…</p>
    </section>

    <!-- ============ Clue input ============ -->
    <section class="screen" id="screen-clue">
      <div class="card">
        <div class="badge">STEP 1</div>
        <h1 class="title">Enter the Clue</h1>
        <p class="prompt" id="clue-prompt"></p>
        <div class="input-wrap">
          <input
            id="clue-input"
            class="big-input"
            type="text"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="characters"
            spellcheck="false"
            placeholder="TYPE HERE"
          />
          <div class="input-glow"></div>
        </div>
        <div class="error" id="clue-error"></div>
        <button class="big-btn" id="clue-submit">Unlock</button>
      </div>
    </section>

    <!-- ============ Video ============ -->
    <section class="screen" id="screen-video">
      <div class="video-frame">
        <span class="corner tl"></span>
        <span class="corner tr"></span>
        <span class="corner bl"></span>
        <span class="corner br"></span>
        <div class="video-wrap">
          <video id="video-player" playsinline controlslist="nodownload" preload="auto"></video>
        </div>
      </div>
      <p class="hint" id="video-hint">Watch the whole video to continue.</p>
      <button class="big-btn" id="video-continue" disabled>Continue</button>
    </section>

    <!-- ============ Question ============ -->
    <section class="screen" id="screen-question">
      <div class="card wide">
        <div class="badge">QUESTION</div>
        <h1 class="title" id="question-text"></h1>
        <div class="options" id="question-options"></div>
        <div class="error" id="question-error"></div>
      </div>
    </section>

    <!-- ============ Vault ============ -->
    <section class="screen" id="screen-vault">
      <div class="vault-scene" id="vault-scene">
        <!-- Cinematic light rays across the screen -->
        <div class="vault-rays" id="vault-rays"></div>

        <!-- 3D stage -->
        <div class="vault-3d">
          <!-- The vault interior (behind the door) -->
          <div class="vault-interior">
            <div class="interior-room">
              <div class="interior-glow"></div>
              <div class="interior-floor"></div>
              <div class="interior-chest">
                <div class="chest-body"></div>
                <div class="chest-lid"></div>
                <div class="chest-glow"></div>
              </div>
            </div>
          </div>

          <!-- The vault door (swings open) -->
          <div class="vault-door" id="vault-door">
            <div class="door-face">
              <div class="door-ring"></div>
              <div class="door-plate"></div>
              <div class="door-rivets">
                <span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span>
              </div>
              <div class="door-handle" id="vault-handle">
                <div class="handle-bar-h"></div>
                <div class="handle-bar-v"></div>
                <div class="handle-hub"></div>
                <div class="handle-hub-inner"></div>
              </div>
              <div class="door-bolts">
                <span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span>
              </div>
            </div>
            <div class="door-edge"></div>
          </div>
        </div>

        <!-- Dust puff and sparkle layers -->
        <canvas id="dust-canvas" class="dust-canvas"></canvas>
        <canvas id="sparkle-canvas" class="sparkle-canvas"></canvas>

        <p class="hint vault-hint" id="vault-hint">Unlocking…</p>
      </div>
    </section>

    <!-- ============ Next clue ============ -->
    <section class="screen" id="screen-next">
      <div class="card wide success-card">
        <div class="badge success">UNLOCKED</div>
        <h1 class="title">Next Clue</h1>
        <p class="prompt" id="next-text"></p>
        <div class="next-images" id="next-images"></div>
        <button class="big-btn" id="next-done">Done</button>
      </div>
    </section>

  </div>

  <script src="/app.js"></script>
</body>
</html>
